name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 2 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          # Remove user if already exists
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDP"
          }
          
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          # Store credentials in environment
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          echo "RDP_USER=RDP" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed"
              exit 1
          }
          
          Write-Host "RDP user created successfully"

      - name: Install Tailscale
        run: |
          try {
              $latestUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
              $installerPath = "$env:TEMP\tailscale.msi"
              
              Write-Host "Downloading Tailscale..."
              Invoke-WebRequest -Uri $latestUrl -OutFile $installerPath -UseBasicParsing
              
              if (-not (Test-Path $installerPath)) {
                  throw "Tailscale installer download failed"
              }
              
              Write-Host "Installing Tailscale..."
              $installResult = Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait -PassThru
              
              if ($installResult.ExitCode -ne 0) {
                  throw "Tailscale installation failed with exit code: $($installResult.ExitCode)"
              }
              
              Remove-Item $installerPath -Force
              Write-Host "Tailscale installed successfully"
          }
          catch {
              Write-Error "Failed to install Tailscale: $_"
              exit 1
          }

      - name: Establish Tailscale Connection
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          try {
              $tailscalePath = "$env:ProgramFiles\Tailscale\tailscale.exe"
              
              if (-not (Test-Path $tailscalePath)) {
                  throw "Tailscale executable not found"
              }
              
              Write-Host "Connecting to Tailscale..."
              & $tailscalePath up --authkey=$env:TAILSCALE_AUTH_KEY `
                --hostname=gh-runner-$env:GITHUB_RUN_ID `
                --accept-routes
              
              $tsIP = $null
              $retries = 0
              $maxRetries = 15
              $waitTime = 5
              
              while (-not $tsIP -and $retries -lt $maxRetries) {
                  Start-Sleep -Seconds $waitTime
                  $tsIP = & $tailscalePath ip -4 2>$null
                  $retries++
                  $waitTime = [Math]::Min($waitTime * 1.5, 30)
                  Write-Host "Attempt $retries/$maxRetries - Waiting for Tailscale IP..."
              }
              
              if (-not $tsIP) {
                  throw "Tailscale IP not assigned after $maxRetries attempts"
              }
              
              $tsIP = $tsIP.Trim()
              echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
              Write-Host "Tailscale connected with IP: $tsIP"
          }
          catch {
              Write-Error "Tailscale connection failed: $_"
              exit 1
          }

      - name: Verify RDP Accessibility
        run: |
          try {
              Write-Host "Testing RDP connectivity on $env:TAILSCALE_IP:3389..."
              
              $maxAttempts = 5
              $attempt = 0
              $connected = $false
              
              while ($attempt -lt $maxAttempts -and -not $connected) {
                  $attempt++
                  $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
                  
                  if ($testResult.TcpTestSucceeded) {
                      $connected = $true
                      Write-Host "RDP port is accessible!"
                  } else {
                      Write-Host "Attempt $attempt/$maxAttempts failed, retrying in 10s..."
                      Start-Sleep -Seconds 10
                  }
              }
              
              if (-not $connected) {
                  throw "RDP port 3389 not accessible after $maxAttempts attempts"
              }
          }
          catch {
              Write-Error "RDP verification failed: $_"
              exit 1
          }

      - name: Show Credentials in Summary
        run: |
          # Write credentials to Job Summary - Only visible to repo owner
          echo "## RDP Access Info" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $env:GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $env:GITHUB_STEP_SUMMARY
          echo "| Address | $env:TAILSCALE_IP |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Username | RDP |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Password | $env:RDP_PASSWORD |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Port | 3389 |" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "> Runner will stay active until workflow is cancelled" >> $env:GITHUB_STEP_SUMMARY

      - name: Maintain Connection
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $startTime = Get-Date
          $warningThreshold = 340
          
          Write-Host "`n================================"
          Write-Host "         RDP ACCESS INFO        "
          Write-Host "================================"
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : RDP"
          Write-Host "Port     : 3389"
          Write-Host "Password : Check Job Summary Tab"
          Write-Host "================================`n"
          Write-Host "Runner started at: $startTime"
          Write-Host "To terminate: Cancel this workflow run`n"
          
          while ($true) {
              $elapsed = (Get-Date) - $startTime
              $elapsedMinutes = [Math]::Round($elapsed.TotalMinutes, 1)
              
              if ($elapsedMinutes -gt $warningThreshold) {
                  Write-Host "WARNING: Runner approaching timeout! Elapsed: ${elapsedMinutes}min"
              } else {
                  Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP Active | Elapsed: ${elapsedMinutes}min | IP: $env:TAILSCALE_IP"
              }
              
              # Check Tailscale still connected
              $tsStatus = & "$env:ProgramFiles\Tailscale\tailscale.exe" status 2>$null
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "WARNING: Tailscale connection lost, attempting reconnect..."
                  & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY
              }
              
              Start-Sleep -Seconds 300
          }

      - name: Cleanup
        if: always()
        run: |
          Write-Host "Cleaning up..."
          
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDP"
              Write-Host "RDP user removed"
          }
          
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          Write-Host "Firewall rule removed"
          
          & "$env:ProgramFiles\Tailscale\tailscale.exe" logout
          Write-Host "Tailscale node removed from tailnet"
          
          Write-Host "Cleanup complete"
